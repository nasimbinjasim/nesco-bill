      let body;

          ? `${taka(Math.abs(delta))} ${delta > 0 ? c.higherBy : c.lowerBy}`

    }

    </div>`;

    } else if (S.tool === "converter") {
      const kwh = round2((S.conv.w * S.conv.q / 1000) * S.conv.h * S.conv.d);
      body = `<div class="card card-lg" style="max-width:32rem;margin:auto"><div style="display:grid;gap:16px;grid-template-columns:1fr 1fr"><div><label class="lbl">${c.tools.watts}</label><input type="number" value="${S.conv.w}" onchange="setConv('w', this)" /></div><div><label class="lbl">${c.tools.hours}</label><input type="number" step="0.1" value="${S.conv.h}" onchange="setConv('h', this)" /></div><div><label class="lbl">${c.tools.days}</label><input type="number" value="${S.conv.d}" onchange="setConv('d', this)" /></div><div><label class="lbl">${c.tools.qty}</label><input type="number" value="${S.conv.q}" onchange="setConv('q', this)" /></div></div><p class="muted" style="margin:24px 0 0;font-size:14px">${c.tools.monthlyKwh}</p><p class="total" style="color:var(--primary)">${fmtN(kwh, 2)}</p></div>`;
    } else if (S.tool === "reverse") {
      const u = unitsForBill(S.rev.amount, S.rev);
      body = `<div class="card card-lg" style="max-width:32rem;margin:auto"><label class="lbl">${c.tools.billAmount}</label><input type="number" value="${S.rev.amount}" onchange="setRev('amount', this)" />
        <label class="lbl" style="margin-top:16px">${c.calc.category}</label><select onchange="setRev('categoryId', this)">${opts(S.rev.categoryId)}</select>
        <label class="lbl" style="margin-top:16px">${c.calc.load}</label><input type="number" step="0.1" value="${S.rev.loadKw}" onchange="setRev('loadKw', this)" />
        <div class="choices" style="margin-top:16px">${chip(!S.rev.prepaid, "setRevPre(false)", c.calc.postpaid)}${chip(S.rev.prepaid, "setRevPre(true)", c.calc.prepaidChoice)}</div>
        ${S.rev.prepaid ? `<div class="choices" style="margin-top:8px">${chip(!S.rev.meterRent, "setRevRent(false)", c.calc.no)}${chip(S.rev.meterRent, "setRevRent(true)", c.calc.yes)}</div>` : ""}
        ${S.rev.prepaid && S.rev.meterRent ? `<div class="choices" style="margin-top:8px">${chip(S.rev.phase === "single", "setRevPhase('single')", c.calc.singlePhase)}${chip(S.rev.phase === "three", "setRevPhase('three')", c.calc.threePhase)}</div>` : ""}
        <p class="muted" style="margin:24px 0 0;font-size:14px">${c.tools.estimatedUnits}</p><p class="total" style="color:var(--primary)">${u == null ? "—" : fmtN(u, 1)}</p></div>`;
    } else {
      const post = bill({ categoryId: S.input.categoryId, units: S.input.units, peak: S.input.peak, off: S.input.off, super: S.input.super, loadKw: S.input.loadKw, prepaid: false, meterRent: false, phase: "single" });
      const pre = bill({ categoryId: S.input.categoryId, units: S.input.units, peak: S.input.peak, off: S.input.off, super: S.input.super, loadKw: S.input.loadKw, prepaid: true, meterRent: false, phase: "single" });
      const saveAmt = post && pre ? round2(post.total - pre.total) : 0;
      body = `<div class="grid-2">${resultCard(post, Object.assign({}, S.input, { prepaid: false, meterRent: false }))}${resultCard(pre, Object.assign({}, S.input, { prepaid: true, meterRent: false }))}</div>
        <div class="mint-box" style="margin-top:16px"><p style="margin:0;font-weight:600">${c.tools.save}: ${taka(saveAmt)}</p><p class="hint">${c.tools.prepaidLead} · ${c.calc.category}: ${S.input.categoryId}</p></div>`;
    }
    return `<div class="wrap page"><span class="badge">${c.updated}</span><h1 style="margin-top:16px;font-size:2rem">${c.tools.title}</h1><p class="lead">${leads[S.tool]}</p>
      <div class="filters" style="margin-top:24px">${tabs.map(([id, lab]) => `<button type="button" class="pill ${S.tool === id ? "on" : ""}" onclick="setTool('${id}')">${lab}</button>`).join("")}</div>
      <div style="margin-top:32px">${body}</div></div>`;
  }
  function pageGuides() {
    const c = t();
    const bn = S.lang === "bn";
    const sections = bn ? [
      { h: "বিলঘর দিয়ে হিসাব", html: `<ol><li>গ্রাহক ক্যাটাগরি বাছুন। বাড়ি হলে LT-A, দোকান LT-E, ক্ষুদ্র কারখানা LT-C1।</li><li>মাসিক ইউনিট লিখুন — বর্তমান রিডিং থেকে আগের রিডিং বাদ।</li><li>অনুমোদিত লোড দিন। না জানলে আবাসিকে ১ কিলোওয়াট ধরে শুরু করুন।</li><li>পোস্টপেইড বা প্রিপেইড। প্রিপেইডে মিটার ভাড়া হ্যাঁ হলে এক ফেজ ৳৪০, থ্রি ফেজ ৳২৫০।</li></ol><div class="callout">ক্যালকুলেটর এনার্জি, ডিমান্ড, ৫% ভ্যাট, ছাড় ও প্রিপেইড মিটার ভাড়া ধরে। ফুয়েল সারচার্জ বা বিলম্ব ফি বিলের কাগজে আলাদা থাকতে পারে।</div>` },
      { h: "সূত্র", html: `<p class="formula">মোট = (এনার্জি + ডিমান্ড − প্রিপেইড ছাড়) + ভ্যাট ৫% + মিটার ভাড়া</p><p>আবাসিকে স্ল্যাব প্রগ্রেসিভ। ২০০ ইউনিট মানে সবকটি উপরের হারে নয়।</p>
        <table><thead><tr><th>লাইন</th><th>হিসাব</th><th>টাকা</th></tr></thead><tbody>
        <tr><td>০–৭৫</td><td>৭৫ × ৳৫.২৬</td><td>৩৯৪.৫০</td></tr>
        <tr><td>৭৬–২০০</td><td>১২৫ × ৳৮.৫০</td><td>১,০৬২.৫০</td></tr>
        <tr><td>ডিমান্ড</td><td>১ × ৳৪২</td><td>৪২.০০</td></tr>
        <tr><td>ভ্যাট ৫%</td><td>১,৪৯৯ × ০.০৫</td><td>৭৪.৯৫</td></tr>
        <tr><td colspan="2"><strong>মোট</strong></td><td><strong>১,৫৭৩.৯৫</strong></td></tr></tbody></table>` },
      { h: "আবাসিক স্ল্যাব (LT-A)", html: `<table><thead><tr><th>ইউনিট</th><th>হার</th><th>নোট</th></tr></thead><tbody>
        <tr><td>০–৫০, মোট ≤ ৫০</td><td>৳৪.৬৩</td><td>লাইফলাইন</td></tr>
        <tr><td>০–৭৫</td><td>৳৫.২৬</td><td>৫১ হলে এখান থেকে</td></tr>
        <tr><td>৭৬–২০০</td><td>৳৮.৫০</td><td></td></tr>
        <tr><td>২০১–৩০০</td><td>৳৯.১০</td><td></td></tr>
        <tr><td>৩০১–৪০০</td><td>৳৯.৬২</td><td></td></tr>
        <tr><td>৪০১–৬০০</td><td>৳১৫.০১</td><td></td></tr>
        <tr><td>৬০১+</td><td>৳১৭.৩৫</td><td></td></tr></tbody></table>
        <div class="callout">৫০ ইউনিট পর্যন্ত ৳৪.৬৩। ৫১ হলে লাইফলাইন উঠে যায় — প্রথম ইউনিট থেকেই ৳৫.২৬।</div>` },
      { h: "ক্যাটাগরি", html: `<table><thead><tr><th>কোড</th><th>কে</th><th>হার</th><th>ডিমান্ড</th></tr></thead><tbody>
        <tr><td>LT-A</td><td>বাড়ি, ফ্ল্যাট</td><td>স্ল্যাব</td><td>৳৪২</td></tr>
        <tr><td>LT-B</td><td>সেচ পাম্প</td><td>ফ্ল্যাট ৳৬.০৪</td><td>৳৪২</td></tr>
        <tr><td>LT-C1</td><td>ক্ষুদ্র শিল্প</td><td>পিক / অফ-পিক</td><td>৳৪৮</td></tr>
        <tr><td>LT-D3</td><td>ইভি চার্জিং</td><td>পিক / অফ-পিক / সুপার</td><td>৳৯০</td></tr>
        <tr><td>LT-E</td><td>দোকান, অফিস</td><td>পিক / অফ-পিক</td><td>৳৯০</td></tr>
        <tr><td>MT</td><td>১১ কেভি শিল্প</td><td>সাধারণত পিক / অফ-পিক</td><td>৳৯০–১২০</td></tr></tbody></table>` },
      { h: "পিক সময়", html: `<p>পিক সাধারণত বিকেল ৫টা–রাত ১১টা। আবাসিক LT-A স্ল্যাব — ঘণ্টা বদলালে হার বদলায় না। দোকান ও শিল্পে অফ-পিক সস্তা।</p>` },
    ] : [
      { h: "Using Bilghor", html: `<ol><li>Pick a category. Home is LT-A, shop LT-E, small factory LT-C1.</li><li>Enter monthly units — current reading minus previous.</li><li>Enter sanctioned load. Start with 1 kW for a home if unsure.</li><li>Postpaid or prepaid. Prepaid meter rent is ৳40 single phase or ৳250 three phase.</li></ol><div class="callout">Energy, demand, 5% VAT, rebate and optional prepaid meter rent are included. Fuel surcharge is not.</div>` },
      { h: "Formula", html: `<p class="formula">Total = (energy + demand − prepaid rebate) + 5% VAT + meter rent</p>

        <tr><td>0–75</td><td>75 × ৳5.26</td><td>394.50</td></tr>
        <tr><td>76–200</td><td>125 × ৳8.50</td><td>1,062.50</td></tr>
        <tr><td>Demand</td><td>1 × ৳42</td><td>42.00</td></tr>
        <tr><td>VAT 5%</td><td>1,499 × 0.05</td><td>74.95</td></tr>
        <tr><td colspan="2"><strong>Total</strong></td><td><strong>1,573.95</strong></td></tr></tbody></table>` },
      { h: "Residential slabs (LT-A)", html: `<table><thead><tr><th>Units</th><th>Rate</th><th>Note</th></tr></thead><tbody>
        <tr><td>0–50 if total ≤ 50</td><td>৳4.63</td><td>Lifeline</td></tr>
        <tr><td>0–75</td><td>৳5.26</td><td>Starts here at 51</td></tr>
        <tr><td>76–200</td><td>৳8.50</td><td></td></tr>
        <tr><td>201–300</td><td>৳9.10</td><td></td></tr>
        <tr><td>301–400</td><td>৳9.62</td><td></td></tr>
        <tr><td>401–600</td><td>৳15.01</td><td></td></tr>
        <tr><td>601+</td><td>৳17.35</td><td></td></tr></tbody></table>` },
      { h: "Categories", html: `<table><thead><tr><th>Code</th><th>Who</th><th>Energy</th><th>Demand</th></tr></thead><tbody>
        <tr><td>LT-A</td><td>Home, flat</td><td>Slabs</td><td>৳42</td></tr>
        <tr><td>LT-B</td><td>Irrigation pump</td><td>Flat ৳6.04</td><td>৳42</td></tr>
        <tr><td>LT-C1</td><td>Small industry</td><td>Peak / off-peak</td><td>৳48</td></tr>
        <tr><td>LT-D3</td><td>EV charging</td><td>Peak / off-peak / super</td><td>৳90</td></tr>
        <tr><td>LT-E</td><td>Shop, office</td><td>Peak / off-peak</td><td>৳90</td></tr>
        <tr><td>MT</td><td>11 kV industry</td><td>Usually TOU</td><td>৳90–120</td></tr></tbody></table>` },
      { h: "Peak hours", html: `<p>Peak is generally 5:00 PM – 11:00 PM. Residential LT-A is a monthly slab — the clock does not change the rate. Shops and industry pay less off-peak.</p>` },
    ];
    return `<div class="wrap page"><span class="badge">${c.updated}</span><h1 style="margin-top:16px;font-size:2rem">${c.guides.title}</h1><p class="lead">${c.guides.lead}</p>
      <div class="guide">${sections.map((s) => `<section class="card card-lg" style="margin-top:20px"><h2 style="font-size:1.35rem">${s.h}</h2>${s.html}</section>`).join("")}</div></div>`;
  }
  function pageFaq() {
    const c = t();
    return `<div class="wrap page"><span class="badge">${c.updated}</span><h1 style="margin-top:16px;font-size:2rem">${c.faq.title}</h1><p class="lead">${c.faq.lead}</p>
      <div style="border-top:1px solid var(--border);margin-top:32px">${c.faq.items.map(([q, a]) => `<details class="faq"><summary>${q}<span class="subtle">+</span></summary><p class="muted" style="margin:12px 0 0;max-width:48rem;font-size:14px;line-height:1.6">${a}</p></details>`).join("")}</div></div>`;
  }

  function render() {
    applyTheme();
    const c = t();
    document.getElementById("brand").textContent = c.brand;
    document.getElementById("f-brand").textContent = c.brand;
    document.getElementById("f-tag").textContent = c.tagline;
    document.getElementById("f-copy").innerHTML =
      '<span class="credit-by">' + c.footer.developedBy + '</span> ' +
      '<span class="credit-name">' + c.footer.developedName + "</span>";
    document.getElementById("lang-bn").className = S.lang === "bn" ? "on" : "";
    document.getElementById("lang-en").className = S.lang === "en" ? "on" : "";
    document.getElementById("theme-btn").innerHTML = S.theme === "dark"
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.4 8.4 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
    document.getElementById("nav-desk").innerHTML = navHtml();
    document.getElementById("nav-mob").innerHTML = navHtml();
    document.getElementById("nav-mob").classList.toggle("open", S.menu);
    document.title = c.brand + " — " + c.nav[S.page];
    const pages = { calc: pageCalc, tariff: pageTariff, compare: pageCompare, tools: pageTools, guides: pageGuides, faq: pageFaq };
    document.getElementById("main").innerHTML = (pages[S.page] || pageCalc)();
  }

  window.addEventListener("hashchange", () => {
    const p = (location.hash || "#calc").slice(1);
    if (NAV.includes(p)) { S.page = p; S.menu = false; render(); }
  });
  const start = (location.hash || "#calc").slice(1);
  if (NAV.includes(start)) S.page = start;
  applyTheme();
  render();
})();
  </script>
</body>
